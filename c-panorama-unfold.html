<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VISIT 히어로 대안 C — 파노라마 언폴드</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#00060C}
a{color:#ffffff;text-decoration:none}a:hover{color:#FFA2BE}
a:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
@keyframes vrise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.vrise{animation:vrise .9s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.vrise{animation:none}}
@media (max-width:860px){.v-hide-sm{display:none !important}}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 720px; overflow: hidden; background: #00060C; color: #ffffff; font-family: Pretendard, 'Pretendard Variable', 'Noto Sans KR', sans-serif; font-size: 18px; line-height: 27px">

  <canvas data-stage="unfold" ref="{{ setCanvas }}" onPointerMove="{{ onMove }}" onPointerLeave="{{ onLeave }}" role="img" aria-label="펼쳐진 360도 파노라마 이미지가 구 형태의 가상 공간으로 말려 올라가는 애니메이션." style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"></canvas>

  <header style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px clamp(20px, 5vw, 72px); pointer-events: none">
    <a href="#" aria-label="VISIT 홈" style="display: flex; align-items: center; min-height: 44px; pointer-events: auto">
      <img src="./visit-logo-white.svg" alt="VISIT" style="height: 30px; width: auto; display: block">
    </a>
    <nav class="v-hide-sm" aria-label="주 메뉴" style="display: flex; align-items: center; gap: 44px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 18px; pointer-events: auto">
      <a href="#" style="color: {{accent}}; min-height: 44px; display: flex; align-items: center">Main</a>
      <a href="#" style="min-height: 44px; display: flex; align-items: center">Business</a>
      <a href="#" style="min-height: 44px; display: flex; align-items: center">Shop</a>
      <a href="#" style="min-height: 44px; display: flex; align-items: center">Newsroom</a>
      <a href="#" style="min-height: 44px; display: flex; align-items: center">Team</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 16px; pointer-events: auto">
      <a href="#" style="min-height: 44px; display: flex; align-items: center">KR</a>
      <span aria-hidden="true" style="color: #979797">|</span>
      <a href="#" style="color: #979797; min-height: 44px; display: flex; align-items: center">EN</a>
    </div>
  </header>

  <main class="vrise" style="position: absolute; left: clamp(20px, 5vw, 72px); bottom: 120px; width: min(560px, calc(100% - 40px)); display: flex; flex-direction: column; gap: 24px; pointer-events: none; animation-delay: .2s">
    <p style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 18px; color: {{accent}}">360 Image → VR Space</p>
    <h1 style="margin: 0; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">내 걸음이 닿는<br>모든 공간을,<br><span style="color: {{accent}}">360도</span>로 다채롭게.</h1>
    <p style="margin: 0; max-width: 460px; color: rgba(255,255,255,0.82)">스마트폰으로 촬영한 360 이미지 한 장이 누구나 둘러볼 수 있는 VR 공간 웹이 됩니다. 전 세계 실내외 어디든, 실시간으로 빠르게.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; pointer-events: auto">
      <a href="#" style="display: inline-flex; align-items: center; min-height: 51px; padding: 0 24px; border-radius: 8px; background: {{accent}}; color: #ffffff; font-weight: 700; font-size: 18px">360VR 서비스 보러가기</a>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 51px; padding: 0 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.6); font-weight: 700; font-size: 18px">1:1 문의하기</a>
    </div>
  </main>

  <footer class="v-hide-sm" style="position: absolute; right: clamp(20px, 5vw, 72px); bottom: 40px; display: flex; align-items: center; gap: 14px; font-family: Poppins, sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.08em; color: #979797; pointer-events: none">
    <span>2:1 PANORAMA</span>
    <span aria-hidden="true" style="display: block; width: 48px; height: 1px; background: rgba(255,255,255,0.5)"></span>
    <span style="color: #ffffff">360° SPACE</span>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF004D","options":["#FF004D","#FF5A1F","#FFFFFF"],"section":"브랜드"},"loop":{"editor":"boolean","default":true,"section":"3D 공간"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  px = 0; py = 0; vx = 0; vy = 0; spin = 0; last = 0;
  COLS = 44; ROWS = 22;

  hex(h) {
    h = String(h || '#FF004D').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [255, 0, 77];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const tick = (t) => {
      this.raf = requestAnimationFrame(tick);
      try { this.draw(t); } catch (e) { /* keep the page usable if drawing fails */ }
    };
    this.raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  draw(t) {
    const cv = this.cv || document.querySelector('canvas[data-stage="unfold"]');
    if (!cv) return;
    this.cv = cv;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#00060C';
    g.fillRect(0, 0, W, H);

    const acc = this.hex(this.props.accent);
    const accS = acc[0] + ',' + acc[1] + ',' + acc[2];
    const loop = this.props.loop == null ? true : !!this.props.loop;
    const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

    // morph: 0 = flat 2:1 panorama, 1 = sphere
    let m = 1;
    if (!this.reduce && loop) {
      const T = (t / 1000) % 11;
      m = T < 1.4 ? 0 : T < 4.2 ? ease((T - 1.4) / 2.8) : T < 9 ? 1 : T < 10.6 ? 1 - ease((T - 9) / 1.6) : 0;
    } else if (!this.reduce) {
      m = ease(t / 2800);
    }
    const dt = this.last ? Math.min(60, t - this.last) : 16;
    this.last = t;
    if (!this.reduce) this.spin += dt * 0.00028 * m;
    if (m === 0) this.spin = 0;
    this.vx += (this.px - this.vx) * 0.05;
    this.vy += (this.py - this.vy) * 0.05;

    const wide = W > 900;
    const cx = wide ? W * 0.68 : W * 0.5, cy = wide ? H * 0.48 : H * 0.3;
    const foc = Math.min(W, H) * (wide ? 1.18 : 0.95);
    const yaw = this.spin + this.vx * 0.4, tilt = 0.22 * m + this.vy * 0.22;
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
    const C = this.COLS, R = this.ROWS, DIST = 3.2, RAD = 0.9;

    // project the (C+1) x (R+1) lattice once
    const P = new Array((C + 1) * (R + 1));
    for (let j = 0; j <= R; j++) {
      const v = j / R, lat = (0.5 - v) * Math.PI;
      for (let i = 0; i <= C; i++) {
        const u = i / C, lon = (u - 0.5) * Math.PI * 2;
        const fx = (u - 0.5) * 2.5, fy = (0.5 - v) * 1.25, fz = 0;
        const sx = Math.cos(lat) * Math.sin(lon) * RAD, sy = Math.sin(lat) * RAD, sz = -Math.cos(lat) * Math.cos(lon) * RAD;
        const x = fx + (sx - fx) * m, y = fy + (sy - fy) * m, z = fz + (sz - fz) * m;
        const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
        const y2 = y * ct - z1 * st, z2 = y * st + z1 * ct + DIST;
        P[j * (C + 1) + i] = [cx + foc * x1 / z2, cy - foc * y2 / z2, z2];
      }
    }
    const rnd = (i, j) => { const x = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return x - Math.floor(x); };
    const quads = [];
    for (let j = 0; j < R; j++) {
      for (let i = 0; i < C; i++) {
        const a = P[j * (C + 1) + i], b = P[j * (C + 1) + i + 1], c = P[(j + 1) * (C + 1) + i + 1], d = P[(j + 1) * (C + 1) + i];
        quads.push({ a: a, b: b, c: c, d: d, z: (a[2] + b[2] + c[2] + d[2]) / 4, i: i, j: j });
      }
    }
    quads.sort((q1, q2) => q2.z - q1.z);
    g.lineWidth = 1;
    g.lineJoin = 'round';
    for (let k = 0; k < quads.length; k++) {
      const q = quads[k];
      const h = rnd(q.i, q.j), band = rnd(Math.floor(q.i / 4), Math.floor(q.j / 3));
      const v = q.j / R;
      // abstract panorama: lighter sky, darker ground, blocky "image tile" variation
      let L = (0.07 + 0.30 * (1 - v) * (0.45 + 0.55 * band) + 0.07 * h) * Math.max(0.3, 1.9 - q.z * 0.42);
      if (L > 1) L = 1;
      g.beginPath();
      g.moveTo(q.a[0], q.a[1]); g.lineTo(q.b[0], q.b[1]); g.lineTo(q.c[0], q.c[1]); g.lineTo(q.d[0], q.d[1]); g.closePath();
      g.fillStyle = 'rgb(' + Math.round(78 * L) + ',' + Math.round(6 + 84 * L) + ',' + Math.round(12 + 86 * L) + ')';
      g.fill();
      if (h > 0.965) { g.fillStyle = 'rgba(' + accS + ',0.85)'; g.fill(); }
      g.strokeStyle = 'rgba(255,255,255,' + (0.07 + 0.09 * (1 - m)).toFixed(3) + ')';
      g.stroke();
    }

    // equator = the walking line through the image
    g.beginPath();
    const eq = Math.round(R * 0.62);
    let started = false;
    for (let i = 0; i <= C; i++) {
      const p = P[eq * (C + 1) + i];
      if (m > 0.5 && p[2] > DIST + 0.05) { started = false; continue; }
      if (!started) { g.moveTo(p[0], p[1]); started = true; } else g.lineTo(p[0], p[1]);
    }
    g.strokeStyle = 'rgba(' + accS + ',0.95)';
    g.lineWidth = 2;
    g.setLineDash([2, 7]);
    g.lineCap = 'round';
    g.stroke();
    g.setLineDash([]);

    // legibility scrim behind the copy
    const sg = wide ? g.createLinearGradient(0, 0, W * 0.55, 0) : g.createLinearGradient(0, H, 0, H * 0.35);
    sg.addColorStop(0, 'rgba(0,6,12,0.92)');
    sg.addColorStop(0.6, 'rgba(0,6,12,0.6)');
    sg.addColorStop(1, 'rgba(0,6,12,0)');
    g.fillStyle = sg;
    g.fillRect(0, 0, W, H);
  }

  renderVals() {
    return {
      accent: this.props.accent ?? '#FF004D',
      setCanvas: (el) => { if (el) this.cv = el; },
      onMove: (ev) => {
        const b = ev.currentTarget.getBoundingClientRect();
        this.px = ((ev.clientX - b.left) / b.width - 0.5) * 2;
        this.py = ((ev.clientY - b.top) / b.height - 0.5) * 2;
      },
      onLeave: () => { this.px = 0; this.py = 0; }
    };
  }
}
</script>
</body>
</html>
